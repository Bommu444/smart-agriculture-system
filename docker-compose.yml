services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smart_agriculture
      MYSQL_ROOT_PASSWORD: change_me
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  app:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://db:3306/smart_agriculture?useSSL=false&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: change_me
volumes:
  mysql_data:
