<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Farms</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><a href="/dashboard">← Dashboard</a><h2 class="my-3">Farm management</h2><form method="post" action="/farms" class="row g-2 mb-4"><input class="form-control col" name="name" placeholder="Farm name" required><input class="form-control col" name="location" placeholder="Location"><input class="form-control col" type="number" step="0.01" name="area" placeholder="Area (acres)" required><input class="form-control col" name="soilType" placeholder="Soil type"><button class="btn btn-success">Add farm</button></form><table class="table table-striped"><tr><th>Name</th><th>Location</th><th>Acres</th><th>Soil</th></tr><tr th:each="f:${farms}"><td th:text="${f.name}"></td><td th:text="${f.location}"></td><td th:text="${f.area_acres}"></td><td th:text="${f.soil_type}"></td></tr></table></body></html>
