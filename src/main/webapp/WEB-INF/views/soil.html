<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Soil monitoring</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><a href="/dashboard">← Dashboard</a><h2 class="my-3">Soil monitoring</h2><form method="post" action="/soil" class="row g-2 mb-4"><select class="form-select col" name="farmId" required><option value="">Farm</option><option th:each="f:${farms}" th:value="${f.id}" th:text="${f.name}"></option></select><input class="form-control col" name="ph" type="number" step="0.1" placeholder="pH" required><input class="form-control col" name="moisture" type="number" step="0.1" placeholder="Moisture %" required><input class="form-control col" name="nitrogen" type="number" step="0.1" placeholder="N" required><input class="form-control col" name="phosphorus" type="number" step="0.1" placeholder="P" required><input class="form-control col" name="potassium" type="number" step="0.1" placeholder="K" required><button class="btn btn-success">Save reading</button></form><table class="table"><tr><th>Farm</th><th>pH</th><th>Moisture</th><th>N</th><th>P</th><th>K</th><th>Recorded</th></tr><tr th:each="s:${readings}"><td th:text="${s.farm_name}"></td><td th:text="${s.ph}"></td><td th:text="${s.moisture}"></td><td th:text="${s.nitrogen}"></td><td th:text="${s.phosphorus}"></td><td th:text="${s.potassium}"></td><td th:text="${s.recorded_at}"></td></tr></table></body></html>
