<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Analytics</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><a href="/dashboard">← Dashboard</a><h2 class="my-3">Crop productivity analytics</h2><p>Harvest records are aggregated by crop. Add harvest data to the <code>harvest_records</code> table to populate this view.</p><table class="table"><tr><th>Crop</th><th>Total yield (kg)</th></tr><tr th:each="r:${yieldRows}"><td th:text="${r.crop_name}"></td><td th:text="${r.yield_kg}"></td></tr></table></body></html>
