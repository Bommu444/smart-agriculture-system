<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Crops</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><a href="/dashboard">← Dashboard</a><h2 class="my-3">Crop management</h2><form method="post" action="/crops" class="row g-2 mb-4"><select class="form-select col" name="farmId" required><option value="">Select farm</option><option th:each="f:${farms}" th:value="${f.id}" th:text="${f.name}"></option></select><input class="form-control col" name="cropName" placeholder="Crop" required><input class="form-control col" name="variety" placeholder="Variety"><input class="form-control col" type="date" name="sowingDate" required><button class="btn btn-success">Add crop</button></form><table class="table"><tr><th>Farm</th><th>Crop</th><th>Variety</th><th>Sowing date</th><th>Status</th></tr><tr th:each="c:${crops}"><td th:text="${c.farm_name}"></td><td th:text="${c.crop_name}"></td><td th:text="${c.variety}"></td><td th:text="${c.sowing_date}"></td><td th:text="${c.status}"></td></tr></table></body></html>
