<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Irrigation</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><a href="/dashboard">← Dashboard</a><h2 class="my-3">Irrigation scheduling</h2><form method="post" action="/irrigation" class="row g-2 mb-4"><select class="form-select col" name="farmId" required><option value="">Farm</option><option th:each="f:${farms}" th:value="${f.id}" th:text="${f.name}"></option></select><input class="form-control col" type="datetime-local" name="scheduledAt" required><input class="form-control col" type="number" step="0.1" name="waterLitres" placeholder="Water (litres)" required><input class="form-control col" name="notes" placeholder="Notes"><button class="btn btn-success">Schedule</button></form><table class="table"><tr><th>Farm</th><th>Scheduled at</th><th>Litres</th><th>Notes</th><th>Status</th></tr><tr th:each="i:${items}"><td th:text="${i.farm_name}"></td><td th:text="${i.scheduled_at}"></td><td th:text="${i.water_litres}"></td><td th:text="${i.notes}"></td><td th:text="${i.status}"></td></tr></table></body></html>
